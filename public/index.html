<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Shop Login</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="center-screen">
  <div class="card">
    <h1>Shop Login</h1>
    <input id="login-username" type="text" placeholder="Username" />
    <input id="login-password" type="password" placeholder="Password" />
    <button id="login-button" onclick="login()">Log In</button>
    <p id="login-error" class="error"></p>
  </div>
</div>

<script src="shared.js"></script>
<script>
redirectIfLoggedIn();

async function login() {
  const username = document.getElementById('login-username').value.trim();
  const password = document.getElementById('login-password').value;
  const button = document.getElementById('login-button');

  if (!username || !password) {
    showMessage('login-error', 'Please enter both a username and password.');
    return;
  }

  button.disabled = true;
  button.textContent = 'Logging in...';
  clearMessage('login-error');

  try {
    const data = await api('/auth/login', {
      method: 'POST',
      body: JSON.stringify({ username, password })
    });
    token = data.token;
    currentUser = data.user;
    localStorage.setItem('token', token);
    localStorage.setItem('user', JSON.stringify(currentUser));
    window.location.href = currentUser.role === 'owner' ? 'owner.html' : 'employee.html';
  } catch (err) {
    showMessage('login-error', err.message || 'Could not log in. Please try again.');
  } finally {
    button.disabled = false;
    button.textContent = 'Log In';
  }
}

document.getElementById('login-password').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') login();
});
</script>
</body>
</html>
